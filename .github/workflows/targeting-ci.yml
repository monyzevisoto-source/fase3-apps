name: Targeting CI

on:
  push:
    branches: [main]
    paths:
      - 'targeting-service/**'
      - '.github/workflows/targeting-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'targeting-service/**'
      - '.github/workflows/targeting-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: targeting-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: targeting-service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run unit tests or syntax check
        run: |
          if find . -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pip install pytest
            python -m pytest
          else
            python -m compileall .
          fi

  lint:
    name: Lint and static analysis
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: targeting-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: targeting-service/requirements.txt
      - run: python -m pip install ruff==0.8.6
      - run: ruff check .
