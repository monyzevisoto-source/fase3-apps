name: Analytics CI

on:
  push:
    branches: [main]
    paths:
      - 'analytics-service/**'
      - '.github/workflows/analytics-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'analytics-service/**'
      - '.github/workflows/analytics-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics-service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run unit tests or syntax check
        run: |
          if find . -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pip install pytest
            python -m pytest
          else
            python -m compileall .
          fi

  lint:
    name: Lint and static analysis
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics-service/requirements.txt
      - run: python -m pip install ruff==0.8.6
      - run: ruff check .

  security:
    name: Security scan
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics-service/requirements.txt
      - run: python -m pip install bandit==1.7.10
      - run: bandit -r .
      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: ${{ github.workspace }}/analytics-service
          severity: CRITICAL
          exit-code: '1'
