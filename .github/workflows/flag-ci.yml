name: Flag CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'flag-service/**'
      - '.github/workflows/flag-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flag-service/**'
      - '.github/workflows/flag-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: flag-service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run unit tests or syntax check
        run: |
          if find . -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pip install pytest
            python -m pytest
          else
            python -m compileall .
          fi

  lint:
    name: Lint and static analysis
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: flag-service/requirements.txt
      - run: python -m pip install ruff==0.8.6
      - run: ruff check .

  security:
    name: Security scan
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: flag-service/requirements.txt
      - run: python -m pip install bandit==1.7.10
      - run: bandit -r .
      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: ${{ github.workspace }}/flag-service
          severity: CRITICAL
          exit-code: '1'

  image:
    name: Build, scan, and publish image
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Define image tag
        id: image-tag
        shell: bash
        run: |
          VERSION=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || printf 'v1.0.0')
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag: $VERSION. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "tag=${VERSION}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: docker build --tag local/flag-service:${{ steps.image-tag.outputs.tag }} flag-service
      # - name: Scan image with Trivy
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     version: v0.74.0
      #     image-ref: local/flag-service:${{ steps.image-tag.outputs.tag }}
      #     severity: CRITICAL
      #     exit-code: '1'
      - name: Configure AWS credentials
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          docker tag local/flag-service:${{ steps.image-tag.outputs.tag }} 360302648026.dkr.ecr.us-east-1.amazonaws.com/fiap-fase3-dev-flag:${{ steps.image-tag.outputs.tag }}
          docker push 360302648026.dkr.ecr.us-east-1.amazonaws.com/fiap-fase3-dev-flag:${{ steps.image-tag.outputs.tag }}
