name: Flag CI

on:
  push:
    branches: [main]
    paths:
      - 'flag-service/**'
      - '.github/workflows/flag-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flag-service/**'
      - '.github/workflows/flag-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: flag-service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run unit tests or syntax check
        run: |
          if find . -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pip install pytest
            python -m pytest
          else
            python -m compileall .
          fi
