name: Evaluation CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'evaluation-service/**'
      - '.github/workflows/evaluation-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'evaluation-service/**'
      - '.github/workflows/evaluation-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: evaluation-service/go.sum
      - run: go mod download
      - run: go build ./...
      - run: go test ./...

  lint:
    name: Lint and static analysis
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: evaluation-service/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.1
          working-directory: evaluation-service

  security:
    name: Security scan
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: evaluation-service/go.sum
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.20.0
      - run: gosec ./...
      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: ${{ github.workspace }}/evaluation-service
          severity: CRITICAL
          exit-code: '1'

  image:
    name: Build, scan, and publish image
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Define image tag
        id: image-tag
        shell: bash
        run: |
          VERSION=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || printf 'v1.0.0')
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag: $VERSION. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "tag=${VERSION}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: docker build --tag local/evaluation-service:${{ steps.image-tag.outputs.tag }} evaluation-service
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: local/evaluation-service:${{ steps.image-tag.outputs.tag }}
          severity: CRITICAL
          exit-code: '1'
      - name: Configure AWS credentials
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          docker tag local/evaluation-service:${{ steps.image-tag.outputs.tag }} 360302648026.dkr.ecr.us-east-1.amazonaws.com/fiap-fase3-dev-evaluation:${{ steps.image-tag.outputs.tag }}
          docker push 360302648026.dkr.ecr.us-east-1.amazonaws.com/fiap-fase3-dev-evaluation:${{ steps.image-tag.outputs.tag }}

  gitops:
    name: Update Argo CD image
    needs: image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: fase3-argocd-main
      queue: max
    steps:
      - name: Checkout Argo CD repository
        uses: actions/checkout@v4
        with:
          repository: monyzevisoto-source/fase3-argocd
          ref: main
          path: argocd-repo
          token: ${{ secrets.ARGOCD_REPO_TOKEN }}
          persist-credentials: false
      - name: Update image in Argo CD repository
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # v0.17.0
        with:
          repository: monyzevisoto-source/fase3-argocd
          workDir: argocd-repo
          valueFile: services/evaluation-service/deployment.yaml
          propertyPath: '$.spec.template.spec.containers[?(@.name=="evaluation-service")].image'
          value: 360302648026.dkr.ecr.us-east-1.amazonaws.com/fiap-fase3-dev-evaluation:${{ needs.image.outputs.image-tag }}
          branch: main
          masterBranchName: main
          targetBranch: main
          commitChange: true
          createPR: false
          force: false
          message: 'deploy: update evaluation-service to ${{ needs.image.outputs.image-tag }}'
          token: ${{ secrets.ARGOCD_REPO_TOKEN }}
