name: Evaluation CI

on:
  push:
    branches: [main]
    paths:
      - 'evaluation-service/**'
      - '.github/workflows/evaluation-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'evaluation-service/**'
      - '.github/workflows/evaluation-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache-dependency-path: evaluation-service/go.sum
      - run: go mod download
      - run: go build ./...
      - run: go test ./...

  lint:
    name: Lint and static analysis
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache-dependency-path: evaluation-service/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          working-directory: evaluation-service

  security:
    name: Security scan
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache-dependency-path: evaluation-service/go.sum
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.20.0
      - run: gosec ./...
      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: ${{ github.workspace }}/evaluation-service
          severity: CRITICAL
          exit-code: '1'

  image:
    name: Build, scan, and publish image
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag local/evaluation-service:${{ github.sha }} evaluation-service
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: local/evaluation-service:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag local/evaluation-service:${{ github.sha }} 360302648026.dkr.ecr.us-east-1.amazonaws.com/fiap-fase3-dev-evaluation:${{ github.sha }}
          docker push 360302648026.dkr.ecr.us-east-1.amazonaws.com/fiap-fase3-dev-evaluation:${{ github.sha }}
