name: Auth CI

on:
  push:
    branches: [main]
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache-dependency-path: auth-service/go.sum
      - run: go mod download
      - run: go build ./...
      - run: go test ./...
