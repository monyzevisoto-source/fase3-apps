name: Auth CI

on:
  push:
    branches: [main]
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache-dependency-path: auth-service/go.sum
      - run: go mod download
      - run: go build ./...
      - run: go test ./...

  lint:
    name: Lint and static analysis
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache-dependency-path: auth-service/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          working-directory: auth-service

  security:
    name: Security scan
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache-dependency-path: auth-service/go.sum
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.20.0
      - run: gosec ./...
      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: ${{ github.workspace }}/auth-service
          severity: CRITICAL
          exit-code: '1'
